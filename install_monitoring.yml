---
- name: Install node exporter on the Helsinki VPN host
  hosts: hetzner
  become: true
  serial: 1
  vars:
    node_exporter_listen_address: 127.0.0.1
  roles:
    - node_exporter

- name: Install VictoriaMetrics and Grafana in Helsinki
  hosts: hetzner
  become: true
  serial: 1
  roles:
    - monitoring
    - grafana_acme
