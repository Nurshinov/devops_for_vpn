---
- name: Validate VPN benchmark settings
  ansible.builtin.assert:
    that:
      - vpn_benchmark_bind_address | length > 0
      - vpn_benchmark_port | int > 0
      - vpn_benchmark_port | int < 65536
      - vpn_benchmark_openvpn_service | length > 0
    fail_msg: A valid VPN bind address, port, and OpenVPN service are required

- name: Prevent the distribution iperf3 daemon from being enabled
  ansible.builtin.debconf:
    name: iperf3
    question: iperf3/start_daemon
    value: 'false'
    vtype: boolean

- name: Install iperf3
  ansible.builtin.apt:
    name: iperf3
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install the VPN-only iperf3 service
  ansible.builtin.template:
    src: vpn-benchmark-iperf3.service.j2
    dest: /etc/systemd/system/vpn-benchmark-iperf3.service
    owner: root
    group: root
    mode: '0644'
  notify: restart_vpn_benchmark

- name: Enable and start the VPN benchmark server
  ansible.builtin.systemd:
    name: vpn-benchmark-iperf3.service
    state: started
    enabled: true
    daemon_reload: true
